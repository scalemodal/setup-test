<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Geist:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="brand">
      <p class="badge">
        <svg class="icon icon-sparkle" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
          <path d="M20 3v4M22 5h-4M4 17v2M5 18H3"/>
        </svg>
        Sign in
      </p>
      <h1 class="title">Welcome <span class="script">back</span></h1>
      <p class="lede">
        Enter your email and password to continue.<span class="lede-more"><br>We'll take you back to your workspace.</span>
      </p>
    </section>

    <section class="panel">
      <form class="card" action="#" method="post">
        <div class="field">
          <label for="email">Email</label>
          <div class="input">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/>
              <rect x="2" y="4" width="20" height="16" rx="2"/>
            </svg>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="toggle" type="button" aria-label="Show password" aria-controls="password">
              <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
                <path d="m2 2 20 20"/>
              </svg>
            </button>
          </div>
        </div>

        <p class="forgot">
          <a href="#">Forgot password?</a>
        </p>

        <div class="actions">
          <button class="primary" type="submit">Log in</button>
          <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
        </div>
      </form>
    </section>
  </main>

  <script>
    const password = document.getElementById("password");
    const toggle = document.querySelector(".toggle");
    toggle.addEventListener("click", () => {
      const show = password.type === "password";
      password.type = show ? "text" : "password";
      toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
      toggle.classList.toggle("is-on", show);
    });
  </script>
</body>
</html>
